<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Gestor — SM&amp;A</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>SM&amp;A</h1>
    <p id="nome-usuario">Gestor</p>
    <button onclick="importarExcel()">Importar planilha</button>
    <button onclick="sair()">Sair</button>
  </aside>
  <main class="content">
    <div class="card">
      <h2>Nova atividade</h2>
      <form id="form-atividade">
        <label>Descrição</label>
        <textarea id="descricao" required rows="2"></textarea>
        <label>Local</label>
        <input id="local">
        <label>Colaborador responsável</label>
        <select id="colaborador_id"><option value="">— não atribuído —</option></select>
        <label>Prazo previsto</label>
        <input type="date" id="data_fim_prevista">
        <button class="primary" type="submit">Criar atividade</button>
      </form>
    </div>

    <div class="card">
      <h2>Todas as atividades</h2>
      <table>
        <thead>
          <tr><th>Descrição</th><th>Local</th><th>Colaborador</th><th>Prazo</th><th>Status</th></tr>
        </thead>
        <tbody id="tabela-atividades"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Cadastrar colaborador</h2>
      <form id="form-usuario">
        <label>Nome</label>
        <input id="u-nome" required>
        <label>E-mail</label>
        <input type="email" id="u-email" required>
        <label>Senha provisória</label>
        <input type="password" id="u-senha" required>
        <label>Perfil</label>
        <select id="u-role">
          <option value="COLABORADOR">Colaborador</option>
          <option value="GESTOR">Gestor</option>
        </select>
        <button class="primary" type="submit">Cadastrar</button>
      </form>
    </div>
  </main>
</div>

<script src="assets/api.js"></script>
<script>
  exigirLogin("GESTOR");
  document.getElementById("nome-usuario").textContent = sessionStorage.getItem("sma_nome") || "Gestor";

  let colaboradores = [];

  function classeBadge(a) {
    if (a.situacao_prazo === "Atrasado") return "late";
    if (a.status === "Concluído") return "ok";
    return "warn";
  }

  async function carregarColaboradores() {
    colaboradores = await apiFetch("/api/usuarios");
    const select = document.getElementById("colaborador_id");
    select.innerHTML = '<option value="">— não atribuído —</option>' +
      colaboradores.filter(u => u.role === "COLABORADOR")
        .map(u => `<option value="${u.id}">${u.nome}</option>`).join("");
  }

  async function carregarAtividades() {
    const atividades = await apiFetch("/api/atividades");
    document.getElementById("tabela-atividades").innerHTML = atividades.map(a => {
      const colaborador = colaboradores.find(u => u.id === a.colaborador_id);
      return `<tr>
        <td>${a.descricao}</td>
        <td>${a.local ?? ""}</td>
        <td>${colaborador ? colaborador.nome : "-"}</td>
        <td>${a.data_fim_prevista ?? "-"}</td>
        <td><span class="badge ${classeBadge(a)}">${a.status}</span></td>
      </tr>`;
    }).join("");
  }

  document.getElementById("form-atividade").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    await apiFetch("/api/atividades", {
      method: "POST",
      body: JSON.stringify({
        descricao: document.getElementById("descricao").value,
        local: document.getElementById("local").value || null,
        colaborador_id: Number(document.getElementById("colaborador_id").value) || null,
        data_fim_prevista: document.getElementById("data_fim_prevista").value || null,
      }),
    });
    ev.target.reset();
    carregarAtividades();
  });

  document.getElementById("form-usuario").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    await apiFetch("/api/usuarios", {
      method: "POST",
      body: JSON.stringify({
        nome: document.getElementById("u-nome").value,
        email: document.getElementById("u-email").value,
        senha: document.getElementById("u-senha").value,
        role: document.getElementById("u-role").value,
      }),
    });
    ev.target.reset();
    await carregarColaboradores();
    alert("Colaborador cadastrado.");
  });

  async function importarExcel() {
    try {
      const r = await apiFetch("/api/sync/importar-excel", { method: "POST" });
      alert(`Importação concluída: ${r.criadas} criadas, ${r.atualizadas} atualizadas.`);
      carregarAtividades();
    } catch (e) {
      alert("Erro ao importar: " + e.message);
    }
  }

  (async () => {
    await carregarColaboradores();
    await carregarAtividades();
  })();
</script>
</body>
</html>
